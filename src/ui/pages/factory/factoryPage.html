<!-- FACTORY PAGE — workforce header, production-line rail, focused line detail.
     Pick a line on the left; the detail shows a COMPACT crew summary (the full
     type × shift roster lives in the Manage Crew console) and the line's flow. -->
<div id="tab-factory" class="tab-panel">
  <div class="factory">
    <!-- Workforce header: the four numbers that actually describe your day.
         "At home" is elves already sent home — they come back tomorrow, and
         nothing used to show them anywhere. -->
    <div class="workforce-bar">
      <div class="wf-stat wf-total">
        <span class="wf-label" data-i18n="factory.total">Elves</span>
        <strong class="wf-value" id="totalElves">0</strong>
      </div>
      <div class="wf-sep"></div>
      <div class="wf-stat wf-onshift">
        <span class="wf-label" data-i18n="factory.onShift">On shift now</span>
        <strong class="wf-value" id="assignedElves">0</strong>
      </div>
      <div class="wf-stat wf-idle">
        <span class="wf-label" data-i18n="factory.idleElves">Idle</span>
        <strong class="wf-value" id="unassignedElves">0</strong>
      </div>
      <div class="wf-stat wf-home">
        <span class="wf-label" data-i18n="factory.atHome">At home</span>
        <strong class="wf-value" id="spentElves">0</strong>
      </div>

      <!-- Live day clock: which shift is running and how the crew is spread. -->
      <div class="wf-shifts" id="wfShifts"></div>
    </div>

    <div class="factory-body">
      <aside class="factory-rail" id="factoryRail"></aside>
      <section class="factory-detail" id="factoryDetail"></section>
    </div>
  </div>
</div>
